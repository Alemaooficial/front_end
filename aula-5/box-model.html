<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box model</title>
    <style>
        div {
            margin: 20px;

        }

        .conten-box {
            background-color: cyan;
            width: 300px;
            padding: 20px;
            border: 5px solid red;
        }

    
    </style>
</head>
<body>
    <h1>Exemplos box-level e inline-level</h1>
    <p>
        Parágrafo é box-level (quebra de linha automaticamente), mas os <a href="#">links são inline-level</a>
        (permanecem na mesma linha).</p>

    <h2>boz-sizing: </h2>
    <div class="conten-box">Content-box (padrão)</div>
    <div class="conten-box">Border-box</div>


</body>
</html>

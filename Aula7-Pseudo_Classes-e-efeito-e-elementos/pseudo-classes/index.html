<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <section>
        <p>Este é o primeiro paragrafo (Deve ficar em negrito pelo :first-child).</p>
    </section>

    <section>
        <h3>Lista de itens</h3>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Último Item</li>
            <li>Ultimo Item(deve ficar vermelho pelo :last-child)</li>
        </ul>
    </section>
    <section>
        <h3>Tabela com linhas alternadas (:nth-child)</h3>
        <table>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
            </tr>
            <tr>
                <th>Augusto</th>
                <th>16</th>
            </tr>
            <tr>
                <th>igor</th>
                <th>23</th>
            </tr>

            <tr>
                <th>Joao</th>
                <th>12</th>
            </tr>

            <tr>
                <th>Matheus</th>
                <th>32</th>
            </tr>
        </table>
    </section>
</body>


</html>
